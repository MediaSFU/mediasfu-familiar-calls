<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">MediaSFU Connect React Native media-resolution contract</title>
  <desc id="desc">Three visual states showing screen share priority, remote camera priority, independent audio mounting, mirroring, media indicators, and recoverable action errors.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b13"/>
      <stop offset="0.55" stop-color="#103323"/>
      <stop offset="1" stop-color="#173d2d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff7e6"/>
      <stop offset="1" stop-color="#b8e1c4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#00140b" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="110" r="260" fill="#46b66a" opacity=".08"/>
  <circle cx="90" cy="920" r="330" fill="#94d7a7" opacity=".06"/>

  <text x="92" y="88" fill="#a6e8b7" font-family="Segoe UI, Arial" font-size="20" font-weight="700" letter-spacing="3">MEDIA RESOLUTION EVIDENCE</text>
  <text x="92" y="142" fill="#ffffff" font-family="Segoe UI, Arial" font-size="42" font-weight="800">MediaSFU Connect · React Native</text>
  <text x="92" y="183" fill="#c9dfd0" font-family="Segoe UI, Arial" font-size="20">Deterministic presentation contract — not a claim of live transport acceptance</text>

  <g transform="translate(92 230)" filter="url(#shadow)">
    <rect width="438" height="636" rx="36" fill="#f5faf6"/>
    <text x="30" y="48" fill="#1f6e41" font-family="Segoe UI, Arial" font-size="13" font-weight="800" letter-spacing="2">STATE 01 · SCREEN SHARE</text>
    <text x="30" y="82" fill="#10251c" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Jamie’s screen is primary</text>
    <rect x="24" y="108" width="390" height="330" rx="26" fill="#10251c"/>
    <rect x="42" y="132" width="354" height="242" rx="15" fill="url(#screen)"/>
    <rect x="66" y="158" width="150" height="13" rx="6" fill="#4a8e60" opacity=".7"/>
    <rect x="66" y="190" width="280" height="9" rx="4" fill="#6ca87d" opacity=".5"/>
    <rect x="66" y="215" width="240" height="9" rx="4" fill="#6ca87d" opacity=".5"/>
    <rect x="66" y="254" width="125" height="86" rx="12" fill="#2e7650" opacity=".92"/>
    <rect x="207" y="254" width="139" height="86" rx="12" fill="#80bd91" opacity=".82"/>
    <rect x="42" y="386" width="354" height="38" rx="10" fill="#071c14"/>
    <text x="56" y="410" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Jamie’s screen</text>
    <text x="280" y="410" fill="#9fdeb0" font-family="Segoe UI, Arial" font-size="11">Screen live</text>
    <rect x="48" y="454" width="154" height="105" rx="18" fill="#2a6d4a" stroke="#bcebc8" stroke-width="3"/>
    <circle cx="92" cy="492" r="24" fill="#b7dfbf"/>
    <text x="84" y="500" fill="#1a623a" font-family="Segoe UI, Arial" font-size="20" font-weight="800">J</text>
    <text x="64" y="542" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="700">Jamie · mic on</text>
    <rect x="222" y="454" width="154" height="105" rx="18" fill="#347b55" stroke="#bcebc8" stroke-width="3"/>
    <path d="M246 470 L352 470 L246 545 Z" fill="#78b88a" opacity=".35"/>
    <text x="240" y="542" fill="#ffffff" font-family="Segoe UI, Arial" font-size="12" font-weight="700">You · mirrored</text>
    <rect x="24" y="580" width="390" height="34" rx="17" fill="#e0f2e5"/>
    <circle cx="45" cy="597" r="6" fill="#2da560"/>
    <text x="60" y="603" fill="#28613d" font-family="Segoe UI, Arial" font-size="12" font-weight="700">All remote audio remains mounted</text>
  </g>

  <g transform="translate(580 230)" filter="url(#shadow)">
    <rect width="438" height="636" rx="36" fill="#f5faf6"/>
    <text x="30" y="48" fill="#1f6e41" font-family="Segoe UI, Arial" font-size="13" font-weight="800" letter-spacing="2">STATE 02 · CAMERA CALL</text>
    <text x="30" y="82" fill="#10251c" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Remote first, local preview</text>
    <rect x="24" y="108" width="390" height="372" rx="26" fill="#10251c"/>
    <rect x="42" y="128" width="354" height="292" rx="18" fill="#286246"/>
    <circle cx="219" cy="246" r="72" fill="#b7dfbf"/>
    <text x="194" y="268" fill="#1a623a" font-family="Segoe UI, Arial" font-size="56" font-weight="800">J</text>
    <rect x="56" y="365" width="208" height="40" rx="12" fill="#071c14"/>
    <text x="70" y="389" fill="#ffffff" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Jamie · Mic on · Camera on</text>
    <rect x="272" y="140" width="108" height="138" rx="18" fill="#3c835d" stroke="#d9f1df" stroke-width="3"/>
    <path d="M284 154 L366 154 L284 264 Z" fill="#8bc89b" opacity=".35"/>
    <rect x="281" y="239" width="90" height="27" rx="8" fill="#071c14"/>
    <text x="293" y="257" fill="#ffffff" font-family="Segoe UI, Arial" font-size="11" font-weight="700">You · mirrored</text>
    <text x="30" y="520" fill="#476655" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Remote track attaches before first-frame unmute</text>
    <g transform="translate(30 548)">
      <rect width="82" height="62" rx="16" fill="#ffffff" stroke="#dce9df"/>
      <circle cx="41" cy="22" r="12" fill="#eaf4ec"/>
      <text x="36" y="27" fill="#237446" font-family="Segoe UI Symbol, Arial" font-size="15">●</text>
      <text x="27" y="49" fill="#2b4b37" font-family="Segoe UI, Arial" font-size="11" font-weight="700">Mute</text>
      <rect x="96" width="82" height="62" rx="16" fill="#d9f1df" stroke="#93caa1"/>
      <circle cx="137" cy="22" r="12" fill="#c6e8ce"/>
      <text x="132" y="27" fill="#237446" font-family="Segoe UI Symbol, Arial" font-size="15">●</text>
      <text x="116" y="49" fill="#2b4b37" font-family="Segoe UI, Arial" font-size="11" font-weight="700">Camera</text>
      <rect x="192" width="82" height="62" rx="16" fill="#ffffff" stroke="#dce9df"/>
      <text x="210" y="38" fill="#2b4b37" font-family="Segoe UI, Arial" font-size="11" font-weight="700">Switch cam</text>
      <rect x="288" width="82" height="62" rx="16" fill="#ffffff" stroke="#dce9df"/>
      <text x="306" y="38" fill="#2b4b37" font-family="Segoe UI, Arial" font-size="11" font-weight="700">Workspace</text>
    </g>
  </g>

  <g transform="translate(1068 230)" filter="url(#shadow)">
    <rect width="438" height="636" rx="36" fill="#f5faf6"/>
    <text x="30" y="48" fill="#1f6e41" font-family="Segoe UI, Arial" font-size="13" font-weight="800" letter-spacing="2">STATE 03 · RECOVERY</text>
    <text x="30" y="82" fill="#10251c" font-family="Segoe UI, Arial" font-size="25" font-weight="800">Audio-only and actionable errors</text>
    <rect x="24" y="108" width="390" height="330" rx="26" fill="#10251c"/>
    <circle cx="219" cy="236" r="92" fill="none" stroke="#57b976" stroke-width="9" opacity=".35"/>
    <circle cx="219" cy="236" r="72" fill="#b7dfbf"/>
    <text x="194" y="258" fill="#1a623a" font-family="Segoe UI, Arial" font-size="56" font-weight="800">J</text>
    <g transform="translate(150 337)" fill="#72c58b">
      <rect x="0" y="14" width="10" height="28" rx="5"/><rect x="22" y="5" width="10" height="46" rx="5"/><rect x="44" y="0" width="10" height="56" rx="5"/><rect x="66" y="5" width="10" height="46" rx="5"/><rect x="88" y="14" width="10" height="28" rx="5"/>
    </g>
    <text x="139" y="416" fill="#effff2" font-family="Segoe UI, Arial" font-size="13" font-weight="700">Microphone live · Camera off</text>
    <rect x="24" y="462" width="390" height="68" rx="17" fill="#fff1ef" stroke="#e5a49e"/>
    <circle cx="52" cy="496" r="12" fill="#cb4b45"/>
    <text x="48" y="501" fill="#ffffff" font-family="Segoe UI, Arial" font-size="14" font-weight="800">!</text>
    <text x="75" y="489" fill="#8d302c" font-family="Segoe UI, Arial" font-size="12" font-weight="800">Camera switch is not ready</text>
    <text x="75" y="509" fill="#7b4b48" font-family="Segoe UI, Arial" font-size="11">Try again after the room reports ready.</text>
    <rect x="24" y="552" width="390" height="62" rx="18" fill="#cb4b45"/>
    <text x="173" y="589" fill="#ffffff" font-family="Segoe UI, Arial" font-size="15" font-weight="800">End call</text>
  </g>

  <g transform="translate(92 910)">
    <rect width="1414" height="52" rx="18" fill="#0a2118" stroke="#2d6b49"/>
    <circle cx="28" cy="26" r="7" fill="#55c77a"/>
    <text x="48" y="32" fill="#cce7d4" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Automated source contracts: 15/15 passed</text>
    <text x="460" y="32" fill="#cce7d4" font-family="Segoe UI, Arial" font-size="14">Focused ESLint: passed</text>
    <text x="760" y="32" fill="#cce7d4" font-family="Segoe UI, Arial" font-size="14">Backend: 6/6 passed</text>
    <text x="1040" y="32" fill="#e7c889" font-family="Segoe UI, Arial" font-size="14">Emulator runtime: pending approval</text>
  </g>
</svg>
